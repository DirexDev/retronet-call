<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroNet Call - Windows 8 Metro</title>
    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1b1b1b; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Ekran logowania w stylu Win8 */
        #auth-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #007acc; display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; transition: opacity 0.5s ease;
        }
        .metro-box {
            background: rgba(0, 0, 0, 0.4); padding: 40px; border-radius: 0px;
            width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
        }
        .metro-box h1 { font-weight: 300; font-size: 28px; margin-bottom: 25px; color: #ffffff; }
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 8px; color: #ccc; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .metro-input {
            width: 100%; padding: 12px; background: rgba(255,255,255,0.9); border: none;
            color: #000; font-size: 15px; outline: none; transition: background 0.2s;
        }
        .metro-input:focus { background: #fff; box-shadow: inset 0 0 0 2px #fff; }
        .metro-btn {
            background: #005a9e; color: white; border: none; padding: 12px 20px;
            font-size: 16px; cursor: pointer; width: 100%; font-weight: 600;
            transition: background 0.2s; margin-top: 10px;
        }
        .metro-btn:hover { background: #004578; }
        .error-msg { color: #ffb3b3; font-size: 13px; margin-top: 15px; text-align: center; }

        /* Główny interfejs aplikacji (Metro UI) */
        #app-screen { display: none; height: 100%; flex-direction: column; background: #005a9e; }
        header { background: rgba(0,0,0,0.3); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h2 { font-weight: 300; font-size: 22px; }
        .user-info { font-size: 14px; display: flex; gap: 15px; align-items: center; }
        .logout-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 5px 12px; cursor: pointer; }
        .logout-btn:hover { background: rgba(255,255,255,0.2); }

        .main-container { display: flex; flex: 1; padding: 20px; gap: 20px; overflow: hidden; }
        .tile-panel { flex: 1; background: rgba(0,0,0,0.2); padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .tile-panel h3 { font-weight: 400; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; }
        
        /* Sekcja wideo / połączeń */
        .video-container { display: flex; gap: 15px; flex: 1; }
        .video-box { flex: 1; background: #000; display: flex; justify-content: center; align-items: center; position: relative; border: 2px solid rgba(255,255,255,0.1); }
        video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 3px 8px; font-size: 12px; }

        .controls { display: flex; gap: 10px; margin-top: 10px; }
        .control-input { flex: 1; padding: 10px; border: none; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Ekran logowania/rejestracji (Windows 8 Style) -->
    <div id="auth-screen">
        <div class="metro-box">
            <h1>RetroNet Sign In</h1>
            <div class="input-group">
                <label>Nazwa użytkownika (Login)</label>
                <div class="input-wrapper">
                    <input type="text" id="username-input" class="metro-input" placeholder="np. karol">
                </div>
                <span style="font-size: 10px; color: #ddd; margin-top: 4px; display: block;">System automatycznie doklei końcówkę do Firebase.</span>
            </div>
            <div class="input-group">
                <label>Hasło</label>
                <input type="password" id="password-input" class="metro-input" placeholder="••••••••">
            </div>
            <button class="metro-btn" onclick="handleAuth('login')">Zaloguj się</button>
            <button class="metro-btn" style="background: #2d2d2d; margin-top: 5px;" onclick="handleAuth('register')">Zarejestruj konto</button>
            <div id="auth-error" class="error-msg"></div>
        </div>
    </div>

    <!-- Ekran główny aplikacji -->
    <div id="app-screen">
        <header>
            <h2>RetroNet Call <span style="font-size: 12px; opacity: 0.7;">(Windows 8 Metro)</span></h2>
            <div class="user-info">
                <span id="current-user-display">Zalogowany</span>
                <button class="logout-btn" onclick="logout()">Wyloguj</button>
            </div>
        </header>

        <div class="main-container">
            <!-- Panel połączeń PeerJS -->
            <div class="tile-panel" style="flex: 2;">
                <h3>Komunikacja P2P (Wideo / Czat)</h3>
                <div style="font-size: 13px; background: rgba(0,0,0,0.2); padding: 10px;">
                    Twój identyfikator połączenia: <strong id="my-peer-id" style="color: #61dafb;">Łączenie...</strong>
                </div>
                <div class="controls">
                    <input type="text" id="peer-id-input" class="control-input" placeholder="Wpisz ID znajomego, aby zadzwonić">
                    <button class="metro-btn" style="margin: 0; width: auto; padding: 0 20px;" onclick="connectToPeer()">Zadzwoń</button>
                </div>
                <div class="video-container">
                    <div class="video-box">
                        <video id="local-video" autoplay muted></video>
                        <div class="video-label">Ty</div>
                    </div>
                    <div class="video-box">
                        <video id="remote-video" autoplay></video>
                        <div class="video-label">Rozmówca</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Prawidłowa konfiguracja Firebase dla projektu retronetcall
        const firebaseConfig = {
            apiKey: "AIzaSyB7Q9TSXa4CQc2nSiUhS044wD463jBHpr0",
            authDomain: "retronetcall.firebaseapp.com",
            projectId: "retronetcall",
            storageBucket: "retronetcall.firebasestorage.app",
            messagingSenderId: "820407833858",
            appId: "1:820407833858:web:e4e1cc71f364955b3bde1b",
            measurementId: "G-E8LEFTF2KN"
        };

        // Inicjalizacja Firebase z trwałą sesją (zostaje zalogowany)
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        const SUFFIX = "@directdev.github.io/retronet-call/index.html?=auth";

        // Obsługa uwierzytelniania
        function handleAuth(type) {
            const usernameInput = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value;
            const errorDiv = document.getElementById('auth-error');
            errorDiv.innerText = "";

            if (!usernameInput || !password) {
                errorDiv.innerText = "Wypełnij nazwę użytkownika oraz hasło!";
                return;
            }

            const fullEmail = usernameInput.includes('@') ? usernameInput : usernameInput + SUFFIX;

            if (type === 'register') {
                auth.createUserWithEmailAndPassword(fullEmail, password)
                    .then((userCredential) => {
                        onLoginSuccess(usernameInput);
                    })
                    .catch((error) => {
                        errorDiv.innerText = "Błąd rejestracji: " + error.message;
                    });
            } else {
                auth.signInWithEmailAndPassword(fullEmail, password)
                    .then((userCredential) => {
                        onLoginSuccess(usernameInput);
                    })
                    .catch((error) => {
                        errorDiv.innerText = "Błąd logowania: " + error.message;
                    });
            }
        }

        function onLoginSuccess(username) {
            document.getElementById('auth-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                document.getElementById('current-user-display').innerText = "Użytkownik: " + username;
                initPeerJS(username);
            }, 500);
        }

        function logout() {
            auth.signOut().then(() => {
                window.location.reload();
            });
        }

        // Inicjalizacja PeerJS do wideo-rozmów / P2P
        let peer;
        let localStream;

        function initPeerJS(username) {
            peer = new Peer(username.replace(/[^a-zA-Z0-9]/g, '_'));

            peer.on('open', (id) => {
                document.getElementById('my-peer-id').innerText = id;
            });

            peer.on('error', (err) => {
                console.error("Błąd PeerJS:", err);
            });

            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then((stream) => {
                    localStream = stream;
                    document.getElementById('local-video').srcObject = stream;
                })
                .catch((err) => {
                    console.warn("Brak dostępu do kamery/mikrofonu:", err);
                });

            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
            });
        }

        function connectToPeer() {
            const destId = document.getElementById('peer-id-input').value.trim();
            if (!destId) return alert("Wpisz ID odbiorcy!");

            const call = peer.call(destId, localStream);
            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        }

        // Automatyczne sprawdzenie sesji (zalogowany raz – pamięta użytkownika)
        auth.onAuthStateChanged((user) => {
            if (user) {
                const cleanName = user.email.split('@')[0];
                onLoginSuccess(cleanName);
            }
        });
    </script>
</body>
</html>
