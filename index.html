<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroNet Call - Windows 8 Metro</title>
    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1b1b1b; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Ekran logowania/rejestracji w stylu Win8 / Flat Metro */
        #auth-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #007acc; display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; transition: opacity 0.5s ease;
        }
        .metro-box {
            background: rgba(0, 0, 0, 0.5); padding: 40px; border-radius: 0px;
            width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.15);
        }
        .metro-box h1 { font-weight: 300; font-size: 28px; margin-bottom: 8px; color: #ffffff; }
        .metro-box p.subtitle { font-size: 13px; color: #b3d7ff; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 18px; position: relative; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #ccc; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .metro-input {
            width: 100%; padding: 12px; background: rgba(255,255,255,0.95); border: none;
            color: #000; font-size: 15px; outline: none; transition: background 0.2s;
        }
        .metro-input:focus { background: #fff; box-shadow: inset 0 0 0 2px #61dafb; }
        
        .domain-tag {
            background: rgba(0, 90, 158, 0.8); color: #fff; padding: 12px 10px;
            font-size: 13px; white-space: nowrap; border-left: 1px solid #ccc;
        }

        .metro-btn {
            background: #005a9e; color: white; border: none; padding: 12px 20px;
            font-size: 15px; cursor: pointer; width: 100%; font-weight: 600;
            transition: background 0.2s; margin-top: 10px; border-radius: 0px;
        }
        .metro-btn:hover { background: #004578; }
        .metro-btn.secondary { background: #2d2d2d; margin-top: 5px; }
        .metro-btn.secondary:hover { background: #3d3d3d; }

        .error-msg { color: #ffb3b3; font-size: 13px; margin-top: 15px; text-align: center; }
        .success-msg { color: #b3ffb3; font-size: 13px; margin-top: 15px; text-align: center; }

        /* Główny interfejs aplikacji (Win8 Metro) */
        #app-screen { display: none; height: 100%; flex-direction: column; background: #005a9e; }
        header { background: rgba(0,0,0,0.3); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h2 { font-weight: 300; font-size: 22px; }
        .user-info { font-size: 14px; display: flex; gap: 15px; align-items: center; }
        .logout-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 5px 12px; cursor: pointer; }
        .logout-btn:hover { background: rgba(255,255,255,0.2); }

        .main-container { display: flex; flex: 1; padding: 20px; gap: 20px; overflow: hidden; }
        .tile-panel { flex: 1; background: rgba(0,0,0,0.2); padding: 25px; display: flex; flex-direction: column; gap: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .tile-panel h3 { font-weight: 300; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; }
        
        .id-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 15px;
            border-left: 4px solid #61dafb;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .link-row { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
        .link-input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 10px; font-size: 12px; outline: none; }
        .copy-btn { background: #005a9e; color: #fff; border: none; padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 600; }
        .copy-btn:hover { background: #004578; }

        .video-container { display: flex; gap: 15px; flex: 1; }
        .video-box { flex: 1; background: #000; display: flex; justify-content: center; align-items: center; position: relative; border: 2px solid rgba(255,255,255,0.1); }
        video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 3px 8px; font-size: 12px; }

        .controls { display: flex; gap: 10px; margin-top: 5px; }
        .control-input { flex: 1; padding: 10px; border: none; font-size: 14px; background: rgba(255,255,255,0.95); outline: none; }
    </style>
</head>
<body>

    <!-- Ekran logowania/rejestracji -->
    <div id="auth-screen">
        <div class="metro-box">
            <h1 id="auth-title">RetroNet ID</h1>
            <p class="subtitle" id="auth-subtitle">Zaloguj się do swojej sieci P2P</p>
            
            <div class="input-group">
                <label>Nazwa konta</label>
                <div class="input-wrapper">
                    <input type="text" id="username-input" class="metro-input" placeholder="np. karol">
                    <span class="domain-tag">@retronet.call</span>
                </div>
            </div>
            
            <div class="input-group">
                <label>Hasło</label>
                <input type="password" id="password-input" class="metro-input" placeholder="••••••••">
            </div>

            <button id="primary-action-btn" class="metro-btn" onclick="handleAuth('login')">Zaloguj się</button>
            <button id="secondary-action-btn" class="metro-btn secondary" onclick="toggleMode()">Nie masz konta? Utwórz nowe</button>
            
            <div id="auth-error" class="error-msg"></div>
            <div id="auth-success" class="success-msg"></div>
        </div>
    </div>

    <!-- Ekran główny aplikacji -->
    <div id="app-screen">
        <header>
            <h2>RetroNet Call <span style="font-size: 12px; opacity: 0.7;">(Windows 8 Metro)</span></h2>
            <div class="user-info">
                <span id="current-user-display">Zalogowany</span>
                <button class="logout-btn" onclick="logout()">Wyloguj</button>
            </div>
        </header>

        <main class="main-container">
            <div class="tile-panel" style="flex: 2;">
                <h3>Komunikacja P2P (Wideo / Czat)</h3>
                
                <!-- Panel pokazujący adres, ID oraz gotowy link do połączenia -->
                <div class="id-card">
                    <div>Adres sieciowy: <strong id="my-full-address" style="color: #61dafb;">Łączenie...</strong></div>
                    <div>Kryptograficzne ID węzła: <strong id="my-peer-id" style="color: #61dafb; font-family: Consolas, monospace;">Oczekiwanie...</strong></div>
                    <div style="margin-top: 4px;">Link do szybkiego połączenia:</div>
                    <div class="link-row">
                        <input type="text" id="share-link-input" class="link-input" readonly value="Generowanie linku...">
                        <button class="copy-btn" onclick="copyShareLink()">Kopiuj link</button>
                    </div>
                </div>

                <div class="controls">
                    <input type="text" id="peer-id-input" class="control-input" placeholder="Wpisz ID znajomego, aby zadzwonić">
                    <button class="metro-btn" style="margin: 0; width: auto; padding: 0 20px;" onclick="connectToPeer()">Zadzwoń</button>
                </div>
                
                <div class="video-container">
                    <div class="video-box">
                        <video id="local-video" autoplay muted></video>
                        <div class="video-label">Ty</div>
                    </div>
                    <div class="video-box">
                        <video id="remote-video" autoplay></video>
                        <div class="video-label">Rozmówca</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB7Q9TSXa4CQc2nSiUhS044wD463jBHpr0",
            authDomain: "retronetcall.firebaseapp.com",
            projectId: "retronetcall",
            storageBucket: "retronetcall.firebasestorage.app",
            messagingSenderId: "820407833858",
            appId: "1:820407833858:web:e4e1cc71f364955b3bde1b",
            measurementId: "G-E8LEFTF2KN"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        const SUFFIX = "@retronet.call";
        let isRegisterMode = false;

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const primaryBtn = document.getElementById('primary-action-btn');
            const secondaryBtn = document.getElementById('secondary-action-btn');
            
            document.getElementById('auth-error').innerText = "";
            document.getElementById('auth-success').innerText = "";

            if (isRegisterMode) {
                title.innerText = "Utwórz konto RetroNet";
                subtitle.innerText = "Zarejestruj swój unikalny identyfikator w sieci";
                primaryBtn.innerText = "Zarejestruj się";
                secondaryBtn.innerText = "Masz już konto? Zaloguj się";
            } else {
                title.innerText = "RetroNet ID";
                subtitle.innerText = "Zaloguj się do swojej sieci P2P";
                primaryBtn.innerText = "Zaloguj się";
                secondaryBtn.innerText = "Nie masz konta? Utwórz nowe";
            }
        }

        function handleAuth(type) {
            const usernameInput = document.getElementById('username-input').value.trim().toLowerCase();
            const password = document.getElementById('password-input').value;
            const errorDiv = document.getElementById('auth-error');
            const successDiv = document.getElementById('auth-success');
            
            errorDiv.innerText = "";
            successDiv.innerText = "";

            if (!usernameInput || !password) {
                errorDiv.innerText = "Wypełnij nazwę konta oraz hasło!";
                return;
            }

            const fullEmail = usernameInput.includes('@') ? usernameInput : usernameInput + SUFFIX;

            if (isRegisterMode) {
                auth.createUserWithEmailAndPassword(fullEmail, password)
                    .then(() => {
                        successDiv.innerText = "Konto utworzono pomyślnie! Logowanie...";
                        setTimeout(() => onLoginSuccess(usernameInput), 800);
                    })
                    .catch((error) => {
                        errorDiv.innerText = "Błąd rejestracji: " + error.message;
                    });
            } else {
                auth.signInWithEmailAndPassword(fullEmail, password)
                    .then(() => {
                        onLoginSuccess(usernameInput);
                    })
                    .catch((error) => {
                        errorDiv.innerText = "Błąd logowania: " + error.message;
                    });
            }
        }

        function onLoginSuccess(username) {
            document.getElementById('auth-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                document.getElementById('current-user-display').innerText = "Konto: " + username + "@retronet.call";
                document.getElementById('my-full-address').innerText = username + "@retronet.call";
                initPeerJS(username);
            }, 500);
        }

        function logout() {
            auth.signOut().then(() => {
                window.location.reload();
            });
        }

        let peer;
        let localStream;

        function initPeerJS(username) {
            const cleanId = "rn_node_" + username.replace(/[^a-zA-Z0-9]/g, '_');
            peer = new Peer(cleanId);

            peer.on('open', (id) => {
                document.getElementById('my-peer-id').innerText = id;
                
                // Generowanie gotowego linku w formacie index.html?call=id
                const baseUrl = window.location.href.split('?')[0];
                const shareLink = baseUrl + "?call=" + encodeURIComponent(id);
                document.getElementById('share-link-input').value = shareLink;

                // Automatyczne sprawdzenie, czy w adresie URL jest parametr ?call=...
                checkUrlForIncomingCall(id);
            });

            peer.on('error', (err) => {
                console.error("Błąd PeerJS:", err);
            });

            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then((stream) => {
                    localStream = stream;
                    document.getElementById('local-video').srcObject = stream;
                })
                .catch((err) => {
                    console.warn("Brak dostępu do kamery/mikrofonu:", err);
                });

            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
            });
        }

        function connectToPeer() {
            const destId = document.getElementById('peer-id-input').value.trim();
            if (!destId) return alert("Wpisz ID odbiorcy!");

            const call = peer.call(destId, localStream);
            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        }

        // Sprawdzanie parametrów w adresie URL i automatyczne dzwonienie
        function checkUrlForIncomingCall(myId) {
            const urlParams = new URLSearchParams(window.location.search);
            const callTarget = urlParams.get('call');

            if (callTarget && callTarget !== myId) {
                document.getElementById('peer-id-input').value = callTarget;
                // Krótkie opóźnienie, aby strumień lokalny zdążył się załadować
                setTimeout(() => {
                    connectToPeer();
                }, 1000);
            }
        }

        // Kopiowanie linku do schowka
        function copyShareLink() {
            const linkInput = document.getElementById('share-link-input');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(linkInput.value);
            alert("Skopiowano link do schowka!");
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                const cleanName = user.email.split('@')[0];
                onLoginSuccess(cleanName);
            }
        });
    </script>
</body>
</html>
