<!DOCTYPE html>

<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RetroNet Call95</title>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>

        :root {

            --win95-gray: #c0c0c0;

            --win95-dark: #808080;

            --win95-darker: #404040;

            --win95-light: #dfdfdf;

            --win95-white: #ffffff;

            --win95-blue: #000080;

        }



        body {

            font-family: 'MS Sans Serif', Tahoma, sans-serif;

            background-color: #008080;

            color: #000000;

            margin: 0;

            padding: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            font-size: 12px;

            -webkit-font-smoothing: none;

        }



        .hidden { display: none !important; }



        .win95-box {

            background-color: var(--win95-gray);

            border-top: 2px solid var(--win95-white);

            border-left: 2px solid var(--win95-white);

            border-right: 2px solid var(--win95-darker);

            border-bottom: 2px solid var(--win95-darker);

            box-shadow: 1px 1px 0px 0px var(--win95-dark);

        }



        .win95-inset {

            background-color: var(--win95-white);

            border-top: 2px solid var(--win95-darker);

            border-left: 2px solid var(--win95-darker);

            border-right: 2px solid var(--win95-light);

            border-bottom: 2px solid var(--win95-light);

        }



        #auth-screen {

            position: fixed;

            top: 0; left: 0; width: 100%; height: 100%;

            background: rgba(0, 128, 128, 0.9);

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 100;

        }



        .auth-card {

            width: 320px;

            padding: 15px;

        }



        .auth-header {

            background-color: var(--win95-blue);

            color: var(--win95-white);

            padding: 3px 6px;

            font-weight: bold;

            margin-bottom: 12px;

            display: flex;

            align-items: center;

            gap: 5px;

        }



        input, button {

            font-family: 'MS Sans Serif', Tahoma, sans-serif;

            font-size: 12px;

            box-sizing: border-box;

            outline: none;

        }



        input {

            width: 100%;

            padding: 4px 6px;

            margin-bottom: 10px;

        }



        button {

            background-color: var(--win95-gray);

            padding: 6px 12px;

            cursor: pointer;

            font-weight: bold;

        }

        button:active {

            border-top: 2px solid var(--win95-darker);

            border-left: 2px solid var(--win95-darker);

            border-right: 2px solid var(--win95-white);

            border-bottom: 2px solid var(--win95-white);

            padding: 7px 11px 5px 13px;

        }



        .app-container {

            width: 900px;

            height: 520px;

            padding: 6px;

            display: flex;

            gap: 6px;

        }



        .sidebar {

            width: 280px;

            display: flex;

            flex-direction: column;

            gap: 6px;

        }



        .user-status-box {

            padding: 8px;

            font-weight: bold;

        }



        .contacts-container {

            flex: 1;

            padding: 2px;

            overflow-y: auto;

        }



        .contact-item {

            padding: 6px;

            margin-bottom: 2px;

            cursor: pointer;

            background: var(--win95-gray);

        }

        .contact-item:hover { background: #d0d0d0; }

        .contact-item.active {

            background: var(--win95-blue);

            color: var(--win95-white);

        }



        .main-panel {

            flex: 1;

            display: flex;

            flex-direction: column;

            gap: 6px;

        }



        .chat-toolbar {

            padding: 4px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }



        .messages-area {

            flex: 1;

            padding: 6px;

            overflow-y: auto;

            display: flex;

            flex-direction: column;

            gap: 4px;

        }



        .message {

            max-width: 70%;

            padding: 6px;

            word-break: break-word;

        }

        .message.incoming {

            background: var(--win95-gray);

            border-top: 1px solid var(--win95-white);

            border-left: 1px solid var(--win95-white);

            border-right: 1px solid var(--win95-darker);

            border-bottom: 1px solid var(--win95-darker);

            align-self: flex-start;

        }

        .message.outgoing {

            background: #e0e0e0;

            align-self: flex-end;

        }



        .chat-input-row {

            display: flex;

            gap: 6px;

            padding: 4px;

        }

        .chat-input-row input { margin-bottom: 0; }



        #call-modal {

            position: fixed;

            top: 0; left: 0; width: 100%; height: 100%;

            background: rgba(0, 0, 0, 0.4);

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 200;

        }



        .call-window {

            width: 600px;

            padding: 6px;

            display: flex;

            flex-direction: column;

            gap: 8px;

        }



        .video-grid {

            display: flex;

            gap: 8px;

            justify-content: center;

        }



        video {

            width: 280px;

            height: 210px;

            background: #000;

        }

    </style>

</head>

<body>



    <!-- EKRAN LOGOWANIA -->

    <div id="auth-screen">

        <div class="win95-box auth-card">

            <div class="auth-header">

                <span>💻 RetroNet Call95 - Logowanie</span>

            </div>

            <div style="margin-bottom: 8px;">Wprowadź swoje dane systemowe:</div>

            <input type="text" id="username-input" class="win95-inset" placeholder="Nazwa użytkownika">

            <input type="tel" id="phone-input" class="win95-inset" placeholder="Numer identyfikacyjny (np. 1001)">

            <button id="login-btn" style="width: 100%;">Połącz z siecią</button>

        </div>

    </div>



    <!-- GŁÓWNY INTERFEJS -->

    <div class="win95-box app-container">

        <div class="sidebar">

            <div class="win95-inset user-status-box" id="user-profile-label">System offline</div>

            <div style="padding: 4px; background: var(--win95-gray);">

                <input type="tel" id="target-phone-input" class="win95-inset" placeholder="Dodaj numer ID..." style="margin-bottom: 4px;">

                <button id="add-contact-btn" style="width: 100%;">+ Dodaj kontakt</button>

            </div>

            <div class="win95-inset contacts-container" id="contacts-list"></div>

        </div>



        <div class="main-panel">

            <div class="win95-box chat-toolbar">

                <span id="current-chat-title" style="font-weight: bold; padding-left: 4px;">Wybierz kontakt</span>

                <div style="display: flex; gap: 4px;">

                    <button id="voice-call-btn" class="hidden">📞 Głos</button>

                    <button id="video-call-btn" class="hidden">📹 Wideo</button>

                </div>

            </div>

            <div class="win95-inset messages-area" id="messages-box"></div>

            <div class="win95-box chat-input-row">

                <input type="text" id="message-input" class="win95-inset" placeholder="Napisz wiadomość...">

                <button id="send-msg-btn" style="width: 80px;">Wyślij</button>

            </div>

        </div>

    </div>



    <!-- MODAL ROZMOWY WIDEO/AUDIO -->

    <div id="call-modal" class="hidden">

        <div class="win95-box call-window">

            <div class="auth-header">

                <span id="call-status-text">Połączenie systemowe...</span>

            </div>

            <div class="video-grid">

                <div>

                    <div style="margin-bottom: 2px;">Twój obraz</div>

                    <video id="local-video" class="win95-inset" autoplay muted playsinline></video>

                </div>

                <div>

                    <div style="margin-bottom: 2px;">Rozmówca</div>

                    <video id="remote-video" class="win95-inset" autoplay playsinline></video>

                </div>

            </div>

            <div style="display: flex; justify-content: flex-end; gap: 6px;">

                <button id="accept-call-btn" class="hidden" style="width: 100px;">Odbierz</button>

                <button id="end-call-btn" style="width: 100px;">Rozłącz</button>

            </div>

        </div>

    </div>



    <script>

        let myPhone = '';

        let myName = '';

        let myPeerId = '';

        let peer = null;

        let localStream = null;

        

        const activeConnections = {};

        let activeCall = null;

        let currentTargetId = null;

        const contacts = {};



        const urlParams = new URLSearchParams(window.location.search);

        const paramType = urlParams.get('type');

        const paramId = urlParams.get('id');



        const authScreen = document.getElementById('auth-screen');

        const usernameInput = document.getElementById('username-input');

        const phoneInput = document.getElementById('phone-input');

        const loginBtn = document.getElementById('login-btn');

        const userProfileLabel = document.getElementById('user-profile-label');

        

        const targetPhoneInput = document.getElementById('target-phone-input');

        const addContactBtn = document.getElementById('add-contact-btn');

        const contactsList = document.getElementById('contacts-list');

        

        const currentChatTitle = document.getElementById('current-chat-title');

        const messagesBox = document.getElementById('messages-box');

        const messageInput = document.getElementById('message-input');

        const sendMsgBtn = document.getElementById('send-msg-btn');

        

        const voiceCallBtn = document.getElementById('voice-call-btn');

        const videoCallBtn = document.getElementById('video-call-btn');

        const callModal = document.getElementById('call-modal');

        const callStatusText = document.getElementById('call-status-text');

        const localVideo = document.getElementById('local-video');

        const remoteVideo = document.getElementById('remote-video');

        const endCallBtn = document.getElementById('end-call-btn');

        const acceptCallBtn = document.getElementById('accept-call-btn');



        navigator.mediaDevices.getUserMedia({ video: true, audio: true })

            .then(stream => {

                localStream = stream;

                localVideo.srcObject = stream;

            })

            .catch(err => console.warn("Brak uprawnień do mediów:", err));



        loginBtn.addEventListener('click', () => {

            myName = usernameInput.value.trim();

            const phone = phoneInput.value.trim().replace(/[^0-9]/g, '');



            if (!myName || phone.length < 3) {

                alert("Wpisz poprawne dane systemowe!");

                return;

            }



            myPhone = phone;

            myPeerId = "net95_" + phone;

            initPeer();

        });



        function initPeer() {

            peer = new Peer(myPeerId);



            peer.on('open', (id) => {

                authScreen.classList.add('hidden');

                userProfileLabel.innerText = `Użytkownik: ${myName} (${myPhone})`;



                if (paramId && paramType === 'call') {

                    const targetPeerId = "net95_" + paramId;

                    if (targetPeerId !== myPeerId) {

                        addContactAndOpen(paramId);

                        setTimeout(() => {

                            callModal.classList.remove('hidden');

                            callStatusText.innerText = `Zapytanie od: ${paramId}`;

                            acceptCallBtn.classList.remove('hidden');

                            

                            acceptCallBtn.onclick = () => {

                                acceptCallBtn.classList.add('hidden');

                                callStatusText.innerText = "Inicjalizowanie łącza...";

                                const call = peer.call(targetPeerId, localStream);

                                setupCallEvents(call);

                            };

                        }, 500);

                    }

                }

            });



            peer.on('error', (err) => alert("Błąd sieci: " + err.type));

            peer.on('connection', (conn) => setupIncomingConnection(conn));

            

            peer.on('call', (incomingCall) => {

                callModal.classList.remove('hidden');

                callStatusText.innerText = "Przychodzące połączenie sieciowe...";

                acceptCallBtn.classList.remove('hidden');

                

                acceptCallBtn.onclick = () => {

                    acceptCallBtn.classList.add('hidden');

                    incomingCall.answer(localStream);

                    setupCallEvents(incomingCall);

                };

            });

        }



        function addContactAndOpen(phone) {

            const targetId = "net95_" + phone;

            if (!contacts[targetId]) {

                contacts[targetId] = { name: "ID: " + phone, phone: phone, messages: [] };

                renderContacts();

            }

            selectContact(targetId);

        }



        addContactBtn.addEventListener('click', () => {

            const phone = targetPhoneInput.value.trim().replace(/[^0-9]/g, '');

            if (!phone) return;

            addContactAndOpen(phone);

            targetPhoneInput.value = '';

        });



        function selectContact(peerId) {

            currentTargetId = peerId;

            currentChatTitle.innerText = contacts[peerId].name;

            voiceCallBtn.classList.remove('hidden');

            videoCallBtn.classList.remove('hidden');

            renderMessages();

            renderContacts();



            if (!activeConnections[peerId]) {

                const conn = peer.connect(peerId);

                setupDataConnection(conn);

            }

        }



        function setupDataConnection(conn) {

            activeConnections[conn.peer] = conn;



            conn.on('data', (data) => {

                if (!contacts[conn.peer]) {

                    contacts[conn.peer] = { name: "ID: " + conn.peer.replace("net95_", ""), phone: "", messages: [] };

                    renderContacts();

                }

                contacts[conn.peer].messages.push({ sender: 'incoming', text: data.text });

                if (currentTargetId === conn.peer) renderMessages();

            });



            conn.on('close', () => delete activeConnections[conn.peer]);

        }



        function setupIncomingConnection(conn) {

            setupDataConnection(conn);

            if (!contacts[conn.peer]) {

                contacts[conn.peer] = { name: "ID: " + conn.peer.replace("net95_", ""), phone: "", messages: [] };

                renderContacts();

            }

        }



        sendMsgBtn.addEventListener('click', () => {

            const text = messageInput.value.trim();

            if (!text || !currentTargetId) return;



            contacts[currentTargetId].messages.push({ sender: 'outgoing', text: text });

            renderMessages();

            messageInput.value = '';



            let conn = activeConnections[currentTargetId];

            if (conn && conn.open) {

                conn.send({ text: text });

            } else {

                conn = peer.connect(currentTargetId);

                setupDataConnection(conn);

                conn.on('open', () => conn.send({ text: text }));

            }

        });



        messageInput.addEventListener('keypress', (e) => {

            if (e.key === 'Enter') sendMsgBtn.click();

        });



        function renderMessages() {

            messagesBox.innerHTML = '';

            if (!currentTargetId || !contacts[currentTargetId]) return;

            

            contacts[currentTargetId].messages.forEach(msg => {

                const div = document.createElement('div');

                div.className = `message ${msg.sender}`;

                div.innerText = msg.text;

                messagesBox.appendChild(div);

            });

            messagesBox.scrollTop = messagesBox.scrollHeight;

        }



        function renderContacts() {

            contactsList.innerHTML = '';

            for (let id in contacts) {

                const div = document.createElement('div');

                div.className = `contact-item ${id === currentTargetId ? 'active' : ''}`;

                div.innerText = contacts[id].name;

                div.onclick = () => selectContact(id);

                contactsList.appendChild(div);

            }

        }



        videoCallBtn.addEventListener('click', () => triggerCallQuery('wideo'));

        voiceCallBtn.addEventListener('click', () => triggerCallQuery('głos'));



        function triggerCallQuery(type) {

            if (!currentTargetId) return;

            const targetPhone = contacts[currentTargetId].phone;

            

            // Poprawna obsługa ścieżki projektu na GitHub Pages (zachowuje bazową ścieżkę /retronet-call/)

            const basePath = window.location.pathname;

            const newUrl = `${basePath}?type=call&id=${targetPhone}`;

            window.history.pushState({path: newUrl}, '', newUrl);



            callModal.classList.remove('hidden');

            callStatusText.innerText = `Wywoływanie (${type})...`;

            

            const call = peer.call(currentTargetId, localStream);

            setupCallEvents(call);

        }



        function setupCallEvents(call) {

            activeCall = call;

            call.on('stream', (remoteStream) => {

                remoteVideo.srcObject = remoteStream;

                callStatusText.innerText = "Połączenie aktywne";

            });

            call.on('close', () => closeCallModal());

            call.on('error', () => closeCallModal());

        }



        endCallBtn.addEventListener('click', () => {

            if (activeCall) activeCall.close();

            closeCallModal();

        });



        function closeCallModal() {

            callModal.classList.add('hidden');

            remoteVideo.srcObject = null;

            if (activeCall) activeCall = null;

            acceptCallBtn.classList.add('hidden');

            callStatusText.innerText = "Połączenie zakończone";

            window.history.pushState({}, '', window.location.pathname);

        }

    </script>

</body>

</html>
